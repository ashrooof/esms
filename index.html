<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ESMS | رفع تذكرة السفر</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1e6cc;--card:#fbf6e9;--ink:#14181f;--mut:#6b6250;--gold:#b8923a;--gold2:#8f6d1f;--line:#dccfa9;--ok:#2f7d4f;--bad:#b3392e;--e:cubic-bezier(.22,1,.36,1);--sp:cubic-bezier(.34,1.56,.64,1)}
@media(prefers-color-scheme:dark){:root{--bg:#10131a;--card:#1a1f27;--ink:#f1e6cc;--mut:#a79e88;--gold:#d3ab4b;--gold2:#e6c26d;--line:#2d3440}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,sans-serif;min-height:100vh;overflow-x:hidden;line-height:1.6}
.ic{width:20px;height:20px;flex:none}
.wrap{max-width:780px;margin:0 auto;padding:30px 16px 60px}
header{text-align:center;margin-bottom:22px}
.hero-logo{font-size:5rem;line-height:1;margin-bottom:10px;filter:drop-shadow(0 10px 18px rgba(143,109,31,.25))}
h1{font:700 2.3rem Amiri,serif;margin:18px 0 4px;background:linear-gradient(100deg,var(--ink) 30%,var(--gold) 50%,var(--ink) 70%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s ease-in-out infinite}
@keyframes shine{0%,100%{background-position:100% 0}50%{background-position:0 0}}
.sub{color:var(--mut);margin:0;font-size:.95rem}
.rule{width:100px;height:3px;margin:14px auto 0;border-radius:3px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.pbar{position:sticky;top:10px;z-index:8;display:flex;align-items:center;gap:12px;padding:11px 18px;margin-bottom:20px;border-radius:999px;background:var(--card);backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.08)}
.trk{flex:1;height:8px;border-radius:8px;background:var(--line);overflow:hidden}
.trk i{display:block;height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,var(--gold2),var(--gold),#f0d58a);transition:width .7s var(--e);box-shadow:0 0 12px var(--gold)}
#pt{font:800 .85rem Cairo;min-width:42px;text-align:center;color:var(--gold2)}
.sec{display:flex;align-items:center;gap:10px;margin:22px 0 14px;font:700 1.1rem Amiri,serif;color:var(--gold2)}
.sec:before{content:"";width:5px;height:24px;border-radius:5px;background:var(--gold)}
.sec:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.grid{display:grid;gap:14px}
.fc{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 6px 18px rgba(0,0,0,.05);transition:border-color .3s,box-shadow .4s var(--e)}
.fc:hover{box-shadow:0 12px 28px rgba(0,0,0,.09)}
.fc:focus-within{border-color:var(--gold);box-shadow:0 0 0 3px rgba(184,146,58,.22)}
.fc.bad{border-color:var(--bad)}
.fc.ok{border-color:rgba(47,125,79,.6)}
.fh{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.fh .ico{width:46px;height:46px;flex:none;border-radius:15px;display:grid;place-items:center;background:rgba(184,146,58,.14);font-size:1.4rem}
.fh label{flex:1;margin:0;font-weight:700;font-size:.95rem}
.fc input{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:13px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px;outline:none;transition:border-color .3s}
.fc input:focus{border-color:var(--gold)}
.fc input::placeholder{color:var(--mut);opacity:.55}
.hint{font-size:.78rem;color:var(--mut);margin-top:8px}
.err{display:grid;grid-template-rows:0fr;color:var(--bad);font-size:.82rem;font-weight:600;transition:grid-template-rows .35s var(--e)}
.err span{overflow:hidden}
.bad .err{grid-template-rows:1fr}
.bad .err span{padding-top:8px}
@keyframes shake{20%{transform:translateX(7px)}40%{transform:translateX(-6px)}60%{transform:translateX(4px)}80%{transform:translateX(-2px)}}
.fc.shake{animation:shake .45s}
.pb{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.avatar{position:relative;width:110px;height:110px;border-radius:50%;flex:none;border:2px dashed var(--gold);cursor:pointer;background:var(--bg) center/cover;display:grid;place-items:center;transition:transform .5s var(--sp)}
.avatar.has{border-style:solid}
.avatar:hover{transform:scale(1.05)}
.avatar .icon{font-size:2.2rem;opacity:.6}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{display:flex;align-items:center;justify-content:center;gap:10px;padding:16px;border:1.5px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);font:600 .95rem Cairo;cursor:pointer;transition:all .3s var(--e)}
.opt:hover{transform:translateY(-3px);border-color:var(--gold)}
.opt.on{border-color:var(--gold);background:rgba(184,146,58,.14);box-shadow:0 12px 26px rgba(184,146,58,.22);transform:translateY(-2px) scale(1.02)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:0 22px;height:52px;border-radius:14px;border:0;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#fff;font:700 1rem Cairo;cursor:pointer;transition:transform .3s var(--sp),box-shadow .3s var(--e);text-decoration:none}
.btn:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(143,109,31,.4)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.7;cursor:not-allowed;transform:none}
.btn.sec{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sec:hover{border-color:var(--gold);box-shadow:none}
.btn.sm{height:44px;padding:0 16px;font-size:.9rem}
.btn.full{width:100%;grid-column:1/-1}
.spin{width:20px;height:20px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
<header>
<div class="hero-logo">🦅</div>
<h1>ESMS | رفع تذكرة السفر</h1>
<p class="sub">استمارة التسجيل والاستعلام عن حالة الطلب</p>
<div class="rule"></div>
</header>
<div class="pbar"><div class="trk"><i id="pf"></i></div><span id="pt">0%</span></div>
<form id="f" class="grid"></form>
<div id="done" style="display:none;text-align:center;padding:40px;background:var(--card);border-radius:20px">
<div style="font-size:5rem">✅</div>
<h2 style="font-family:Amiri,serif">تم استلام طلبك</h2>
<div id="tkt" style="font-size:1.5rem;font-weight:800;color:var(--gold2);margin:16px 0"></div>
<button class="btn sec" onclick="location.reload()">تسجيل طالب آخر</button>
</div>
<section class="sec" style="margin-top:40px">🔍 الاستعلام عن الحالة</section>
<div class="machine" style="background:#2c313b;border-radius:24px;padding:18px;position:relative">
<div class="machine-head" style="display:flex;justify-content:space-between;color:#d3ab4b;margin-bottom:14px">
<span style="font-weight:700">ESMS Machine</span>
<div class="leds" id="leds"></div>
</div>
<div class="screen" style="background:#0e1116;padding:18px;border-radius:12px">
<label style="color:#a79e88;font-size:.82rem">الكود الجامعي</label>
<div style="display:grid;grid-template-columns:1fr auto;gap:8px">
<input id="lq" placeholder="20250123" style="height:48px;border-radius:12px;border:1.5px solid #3a4150;background:#171b22;color:#f1e6cc;text-align:center;font-family:monospace">
<button class="btn sm" id="lgo">استعلم</button>
</div>
<div id="lmsg" style="margin-top:14px;font-size:.88rem;color:#a79e88"></div>
</div>
<div class="slot" style="position:absolute;bottom:14px;left:24px;right:24px;height:8px;background:#000;border-radius:4px"></div>
</div>
<div id="out" style="display:none;background:#fbf6e9;color:#14181f;padding:26px;border-radius:0 0 18px 18px;text-align:center;margin-top:-16px"></div>
<footer style="text-align:center;margin-top:30px;color:var(--mut);font-size:.82rem">
<button id="adminBtn" style="background:none;border:0;opacity:.2;cursor:pointer;padding:6px 8px;color:var(--mut);font-size:1.3rem">🔒</button>
</footer>
</div>
<div id="loginModal" style="position:fixed;inset:0;background:rgba(10,12,16,.6);backdrop-filter:blur(8px);z-index:60;display:none;place-items:center;padding:20px">
<div style="width:min(400px,100%);background:var(--card);border:1px solid var(--line);border-radius:24px;padding:26px;text-align:center">
<h3>دخول الإدارة</h3>
<p style="font-size:.9rem;color:var(--mut)">اضغط على الزر وسيتم إرسال رمز تحقق على تلجرام</p>
<button class="btn full" id="reqOtp">طلب رمز التحقق</button>
<input type="text" id="otpInput" placeholder="أدخل الرمز هنا" style="width:100%;height:50px;text-align:center;margin-top:14px;font-size:1.3rem;letter-spacing:5px">
<button class="btn full" id="verOtp" style="margin-top:14px">تحقق</button>
<div id="loginMsg" style="color:var(--bad);font-size:.85rem;margin-top:10px"></div>
<button class="btn sec" id="closeLogin" style="margin-top:14px">إلغاء</button>
</div>
</div>
<div id="dash" style="position:fixed;inset:0;background:var(--bg);z-index:50;overflow:auto;transform:translateY(100%);visibility:hidden;transition:transform .5s var(--e),visibility 0s .5s;padding:24px 16px">
<div style="max-width:1100px;margin:0 auto">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
<h2 style="font-family:Amiri,serif">لوحة التحكم</h2>
<button class="btn sec sm" id="closeDash">إغلاق</button>
</div>
<div id="stats" class="stats" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px"></div>
<input type="text" id="search" placeholder="بحث بالاسم أو الكود..." style="width:100%;height:50px;padding:0 16px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:inherit;font-size:16px;outline:none;margin-bottom:20px">
<div id="people" class="people" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px"></div>
</div>
</div>
<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbyNfPhWYBOomIzgLviNr3IZZR69OdhwDRpoHpW2X7QGa3QazcmvAuJMs51SRTa5-dmR/exec';
let photoData = '', pdfData = '', present = '', allMembers = [];

// Form Creation
const form = document.getElementById('f');
form.innerHTML = `
<div class="sec">👤 بياناتك الشخصية</div>
<div class="fc" id="w_photo"><div class="fh"><div class="ico">📸</div><label>الصورة الشخصية</label></div><div class="pb"><div class="avatar" id="avatar">📷</div><div><input type="file" id="photoInput" accept="image/*" hidden><button type="button" class="btn sec sm" onclick="document.getElementById('photoInput').click()">اختر صورة</button><div class="hint" id="photoHint">JPG أو PNG</div></div></div><div class="err"><span id="e_photo"></span></div></div>
<div class="fc" id="w_name"><div class="fh"><div class="ico">📝</div><label>الاسم رباعي</label></div><input id="name" placeholder="أحمد محمد علي حسن"><div class="err"><span id="e_name"></span></div></div>
<div class="sec">🆔 بيانات الهوية</div>
<div class="fc" id="w_code"><div class="fh"><div class="ico">🔢</div><label>الكود الجامعي</label></div><input id="code" placeholder="20250123" inputmode="numeric"><div class="err"><span id="e_code"></span></div></div>
<div class="fc" id="w_nid"><div class="fh"><div class="ico">🪪</div><label>الرقم القومي</label></div><input id="nid" placeholder="14 رقم" maxlength="14" inputmode="numeric"><div class="err"><span id="e_nid"></span></div></div>
<div class="fc" id="w_phone"><div class="fh"><div class="ico">📱</div><label>رقم التليفون</label></div><input id="phone" placeholder="01xxxxxxxxx" inputmode="tel"><div class="err"><span id="e_phone"></span></div></div>
<div class="fc" id="w_present"><div class="fh"><div class="ico">🏢</div><label>موجود في البورصة؟</label></div><div class="opts"><div class="opt" data-p="yes">✅ موجود</div><div class="opt" data-p="no">❌ غير موجود</div></div><div class="err"><span id="e_present"></span></div></div>
<div class="sec">📄 التذكرة</div>
<div class="fc" id="w_pdf"><div class="fh"><div class="ico">📎</div><label>ملف التذكرة (PDF)</label></div><input type="file" id="pdfInput" accept=".pdf" hidden><button type="button" class="btn sec sm" onclick="document.getElementById('pdfInput').click()">اختر ملف PDF</button><div class="hint" id="pdfHint">الحد الأقصى 8MB</div><div class="err"><span id="e_pdf"></span></div></div>
<button type="button" class="btn full" id="submitBtn" style="margin-top:20px">📤 إرسال التسجيل</button>`;

// Validation & Progress
const rules = {
  photo: () => photoData ? '' : 'الصورة مطلوبة',
  name: () => form.name.value.trim().split(' ').length >= 4 ? '' : 'الاسم رباعي',
  code: () => /^\d{4,12}$/.test(form.code.value.trim()) ? '' : 'كود غير صحيح',
  nid: () => /^\d{14}$/.test(form.nid.value.trim()) ? '' : '14 رقم',
  phone: () => /^01[0125]\d{8}$/.test(form.phone.value.trim()) ? '' : 'رقم غير صحيح',
  present: () => present ? '' : 'اختر',
  pdf: () => pdfData ? '' : 'الملف مطلوب'
};

function setErr(id, msg) {
  const w = document.getElementById('w_' + id);
  const e = document.getElementById('e_' + id);
  if (e) e.textContent = msg;
  if (w) w.classList.toggle('bad', !!msg);
}

function updateProgress() {
  let filled = 0;
  for (const k in rules) if (!rules[k]()) filled++;
  const p = Math.round((filled / 7) * 100);
  document.getElementById('pf').style.width = p + '%';
  document.getElementById('pt').textContent = p + '%';
}

['name','code','nid','phone'].forEach(k => {
  form[k].addEventListener('input', () => { setErr(k, rules[k]()); updateProgress(); });
});

document.querySelectorAll('.opt').forEach(o => {
  o.onclick = () => {
    present = o.dataset.p;
    document.querySelectorAll('.opt').forEach(x => x.classList.toggle('on', x === o));
    setErr('present', ''); updateProgress();
  };
});

document.getElementById('photoInput').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = ev => {
    photoData = ev.target.result;
    document.getElementById('avatar').style.backgroundImage = `url(${photoData})`;
    document.getElementById('avatar').classList.add('has');
    document.getElementById('avatar').textContent = '';
    document.getElementById('photoHint').textContent = f.name;
    setErr('photo', ''); updateProgress();
  };
  r.readAsDataURL(f);
};

document.getElementById('pdfInput').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = ev => {
    pdfData = ev.target.result;
    document.getElementById('pdfHint').textContent = f.name;
    setErr('pdf', ''); updateProgress();
  };
  r.readAsDataURL(f);
};

document.getElementById('submitBtn').onclick = async () => {
  let valid = true;
  for (const k in rules) { const m = rules[k](); setErr(k, m); if (m) valid = false; }
  if (!valid) return;

  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.innerHTML = '<div class="spin"></div> جاري الإرسال...';

  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({
        name: form.name.value.trim(),
        code: form.code.value.trim(),
        phone: form.phone.value.trim(),
        nid: form.nid.value.trim(),
        present: present,
        photo: photoData,
        pdf: pdfData
      })
    });
    const data = await res.json();
    if (data.success) {
      form.style.display = 'none';
      document.getElementById('done').style.display = 'block';
      document.getElementById('tkt').textContent = 'الكود: ' + data.code;
    } else {
      alert('❌ ' + data.message);
      btn.disabled = false; btn.innerHTML = '📤 إرسال التسجيل';
    }
  } catch (err) {
    alert('❌ حدث خطأ في الاتصال');
    btn.disabled = false; btn.innerHTML = '📤 إرسال التسجيل';
  }
};

// Lookup
document.getElementById('lgo').onclick = async () => {
  const code = document.getElementById('lq').value.trim();
  if (!code) return;
  const msg = document.getElementById('lmsg');
  msg.textContent = 'جاري البحث...';

  try {
    const res = await fetch(`${API_URL}?action=lookup&code=${code}`);
    const data = await res.json();
    if (!data.success) { msg.textContent = '❌ ' + data.message; return; }
    if (!data.found) { msg.textContent = '❌ ' + data.message; return; }

    msg.textContent = '✅ ' + data.name;
    document.getElementById('out').style.display = 'block';
    document.getElementById('out').innerHTML = `
      <h3 style="font-family:Amiri,serif">${data.name}</h3>
      <div>الكود: ${data.code}</div>
      <div style="margin-top:10px;padding:8px 20px;border-radius:20px;display:inline-block;background:${data.status === 'accepted' ? 'rgba(47,125,79,.15)' : data.status === 'rejected' ? 'rgba(179,57,46,.15)' : 'rgba(184,146,58,.15)'}">
        ${data.status === 'accepted' ? '✅ مقبول' : data.status === 'rejected' ? '❌ غير مقبول' : '⏳ تحت المراجعة'}
      </div>`;
  } catch (err) {
    msg.textContent = '❌ خطأ في الاتصال';
  }
};

// Admin Login (OTP)
document.getElementById('adminBtn').onclick = () => {
  document.getElementById('loginModal').style.display = 'grid';
};
document.getElementById('closeLogin').onclick = () => {
  document.getElementById('loginModal').style.display = 'none';
};
document.getElementById('reqOtp').onclick = async () => {
  document.getElementById('loginMsg').textContent = 'جاري الإرسال...';
  const res = await fetch(`${API_URL}?action=request_otp`);
  const data = await res.json();
  document.getElementById('loginMsg').textContent = data.message;
};
document.getElementById('verOtp').onclick = async () => {
  const otp = document.getElementById('otpInput').value.trim();
  const res = await fetch(`${API_URL}?action=verify_otp&otp=${otp}`);
  const data = await res.json();
  if (data.success) {
    document.getElementById('loginModal').style.display = 'none';
    openDashboard();
  } else {
    document.getElementById('loginMsg').textContent = data.message;
  }
};

// Dashboard
async function openDashboard() {
  document.getElementById('dash').style.transform = 'translateY(0)';
  document.getElementById('dash').style.visibility = 'visible';
  await loadStats();
  await loadMembers();
}
document.getElementById('closeDash').onclick = () => {
  document.getElementById('dash').style.transform = 'translateY(100%)';
  document.getElementById('dash').style.visibility = 'hidden';
};
document.getElementById('search').oninput = () => renderMembers();

async function loadStats() {
  const res = await fetch(`${API_URL}?action=stats`);
  const data = await res.json();
  document.getElementById('stats').innerHTML = `
    <div class="stat" style="background:var(--card);padding:16px;border-radius:16px;text-align:center">
      <b style="display:block;font-size:2rem;color:var(--gold2)">${data.total}</b>
      <span>الإجمالي</span>
    </div>
    <div class="stat" style="background:var(--card);padding:16px;border-radius:16px;text-align:center">
      <b style="display:block;font-size:2rem;color:#b8923a">${data.review}</b>
      <span>تحت المراجعة</span>
    </div>
    <div class="stat" style="background:var(--card);padding:16px;border-radius:16px;text-align:center">
      <b style="display:block;font-size:2rem;color:#2f7d4f">${data.accepted}</b>
      <span>مقبول</span>
    </div>`;
}

async function loadMembers() {
  const res = await fetch(`${API_URL}?action=lookup_all`); // Placeholder
  const data = await res.json();
  allMembers = data.members || [];
  renderMembers();
}

function renderMembers() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const filtered = allMembers.filter(m => m.name.toLowerCase().includes(q) || m.code.includes(q));
  document.getElementById('people').innerHTML = filtered.map(m => `
    <div class="person" style="background:var(--card);padding:16px;border-radius:18px">
      <h3 style="text-align:center">${m.name}</h3>
      <div class="row" style="display:flex;justify-content:space-between;padding:6px 0;border-top:1px dashed var(--line)">
        <span>الكود</span><span>${m.code}</span>
      </div>
      <div class="row" style="display:flex;justify-content:space-between;padding:6px 0;border-top:1px dashed var(--line)">
        <span>الحالة</span><span>${m.status}</span>
      </div>
    </div>`).join('');
}

updateProgress();
</script>
</body>
</html>
