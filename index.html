<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ESMS | استمارة التسجيل</title>
<meta name="description" content="استمارة التسجيل والاستعلام عن حالة الطلب - ESMS">
<meta name="theme-color" content="#f1e6cc" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#10131a" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A6%85%3C/text%3E%3C/svg%3E">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1e6cc;--card:rgba(251,246,233,.82);--sol:#fbf6e9;--ink:#14181f;--mut:#6b6250;--gold:#b8923a;--gold2:#8f6d1f;--line:#dccfa9;--ok:#2f7d4f;--bad:#b3392e;--e:cubic-bezier(.22,1,.36,1);--sp:cubic-bezier(.34,1.56,.64,1)}
@media(prefers-color-scheme:dark){:root{--bg:#10131a;--card:rgba(26,31,39,.82);--sol:#1a1f27;--ink:#f1e6cc;--mut:#a79e88;--gold:#d3ab4b;--gold2:#e6c26d;--line:#2d3440}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,sans-serif;min-height:100vh;overflow-x:hidden}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ci{width:24px;height:24px;flex:none;display:block}
.bg{position:fixed;inset:-80px 0;z-index:0;pointer-events:none;overflow:hidden;transform:translateY(calc(var(--p,0)*-.1px))}
.bg i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.36;background:var(--gold);animation:drift 18s ease-in-out infinite alternate}
.bg i:nth-child(1){width:340px;height:340px;top:-90px;right:-60px}
.bg i:nth-child(2){width:300px;height:300px;bottom:-80px;left:-70px;background:var(--gold2);animation-delay:-6s}
.bg i:nth-child(3){width:200px;height:200px;top:45%;left:55%;opacity:.2;animation-delay:-11s}
@keyframes drift{to{transform:translate(-50px,60px) scale(1.25)}}
@keyframes spin{to{transform:rotate(360deg)}}
.wrap{position:relative;z-index:1;max-width:780px;margin:0 auto;padding:30px 16px 60px}
header{text-align:center;margin-bottom:22px;transform:translateY(calc(var(--p,0)*.22px));opacity:calc(1 - var(--p,0)/650)}
.hero{display:block;position:relative;width:min(230px,62%);margin:0 auto;animation:pop 1s var(--sp) both}
.hero:before{content:"";position:absolute;inset:-18% -28%;background:radial-gradient(closest-side,rgba(184,146,58,.34),transparent 72%);z-index:-1;animation:breathe 5s ease-in-out infinite}
.hero img{display:block;width:100%;height:auto;filter:drop-shadow(0 10px 18px rgba(143,109,31,.25))}
@keyframes breathe{50%{transform:scale(1.12);opacity:.7}}@keyframes pop{from{opacity:0;transform:scale(.5) rotate(-8deg)}}
h1{font:700 2.3rem Amiri,serif;margin:18px 0 4px;background:linear-gradient(100deg,var(--ink) 30%,var(--gold) 50%,var(--ink) 70%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s ease-in-out infinite}
@keyframes shine{0%,100%{background-position:100% 0}50%{background-position:0 0}}
.sub{color:var(--mut);margin:0}
.rule{width:100px;height:3px;margin:14px auto 0;border-radius:3px;background:linear-gradient(90deg,transparent,var(--gold),transparent);animation:grow 1.2s var(--e) .4s both}
@keyframes grow{from{transform:scaleX(0)}}
/* progress pill */
.pbar{position:sticky;top:10px;z-index:8;display:flex;align-items:center;gap:12px;padding:11px 18px;margin-bottom:20px;border-radius:999px;background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.08)}
.trk{flex:1;height:8px;border-radius:8px;background:var(--line);overflow:hidden}
.trk i{display:block;height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,var(--gold2),var(--gold),#f0d58a);transition:width .7s var(--e);box-shadow:0 0 12px var(--gold)}
#pt{font:800 .85rem Cairo;min-width:42px;text-align:center;color:var(--gold2)}
.sr{opacity:0;transform:translateY(calc(var(--sy,1)*46px)) scale(.97);filter:blur(3px);transition:opacity .7s var(--e),transform .85s var(--e),filter .7s var(--e)}
.sr.in{opacity:1;transform:none;filter:none;transition-delay:var(--d,0ms)}
@keyframes up{from{opacity:0;transform:translateY(22px)}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}
.sec{grid-column:1/-1;display:flex;align-items:center;gap:10px;margin:14px 0 0;font:700 1.1rem Amiri,serif;color:var(--gold2)}
.sec .ci{width:36px;height:36px;padding:6px;border-radius:12px;background:rgba(184,146,58,.14)}
.sec:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
/* field cards */
.fc{--c:#b8923a;position:relative;overflow:hidden;background:var(--sol);border:1px solid var(--line);border-radius:22px;padding:16px 16px 14px;box-shadow:0 6px 18px rgba(0,0,0,.05);transition:opacity .7s var(--e),transform .7s var(--e),filter .7s var(--e),box-shadow .5s var(--e),border-color .3s}
.fc:before{content:"";position:absolute;z-index:2;inset-block:16px;inset-inline-start:6px;width:4px;border-radius:4px;background:var(--c);transform:scaleY(0);transition:transform .55s var(--e),background .3s}
.fc:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(0,0,0,.09)}
.fc:focus-within{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 22%,transparent),0 16px 34px color-mix(in srgb,var(--c) 18%,transparent)}
.fc:focus-within:before{transform:scaleY(1)}
.fc.ok{border-color:color-mix(in srgb,var(--ok) 55%,var(--line))}.fc.ok:before{transform:scaleY(1);background:var(--ok)}
.fc.bad{border-color:var(--bad)}.fc.bad:before{transform:scaleY(1);background:var(--bad)}
.fh{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.bd{width:46px;height:46px;flex:none;border-radius:15px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,var(--sol));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 30%,transparent);transition:transform .55s var(--sp)}
.bd .ci{width:28px;height:28px}
.fc:focus-within .bd{background:color-mix(in srgb,var(--c) 24%,var(--sol))}
.fh label{flex:1;margin:0;font-weight:700;font-size:.92rem;line-height:1.45}
.st{width:26px;height:26px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;transform:scale(0) rotate(-90deg);transition:transform .55s var(--sp)}
.st .ic{width:15px;height:15px;stroke-width:3}.ok .st{transform:none}
.fc input[type=text],.fc input:not([type]),.fc input[type=email]{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:13px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px;outline:none;transition:border-color .3s}
.fc input:focus{border-color:var(--c)}
.fc input::placeholder{color:var(--mut);opacity:.55}
.hint{font-size:.76rem;color:var(--mut);margin-top:8px}.wh{display:flex;align-items:center;gap:6px}.wh .ci{width:18px;height:18px}
.err{display:grid;grid-template-rows:0fr;color:var(--bad);font-size:.8rem;font-weight:600;transition:grid-template-rows .35s var(--e)}
.err span{overflow:hidden}.bad .err{grid-template-rows:1fr}.bad .err span{padding-top:8px}
.shake,.fc.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(7px)}40%{transform:translateX(-6px)}60%{transform:translateX(4px)}80%{transform:translateX(-2px)}}
/* photo */
.pb{display:flex;align-items:center;gap:20px}
.avatar{position:relative;width:116px;height:116px;border-radius:50%;flex:none;border:0;cursor:pointer;background:var(--bg) center/cover;display:grid;place-items:center;transition:transform .5s var(--sp)}
.avatar .ci{width:42px;height:42px}
.avatar:before{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px dashed var(--c);animation:spin 14s linear infinite}
.avatar:after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--c);opacity:0;animation:ring 2.4s ease-out infinite}
.avatar.has:before{border-style:solid;animation:none}.avatar.has:after{animation:none}.avatar.has .ci{display:none}
.avatar:hover{transform:scale(1.07) rotate(-3deg)}
@keyframes ring{from{opacity:.7;transform:scale(1)}to{opacity:0;transform:scale(1.35)}}
.pi{flex:1}
.pbtn{display:inline-flex;align-items:center;gap:9px;height:44px;padding:0 16px 0 18px;border-radius:13px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:700 .9rem Cairo;cursor:pointer;transition:.3s var(--e)}
.pbtn .ci{width:22px;height:22px}.pbtn:hover{border-color:var(--c);transform:translateY(-2px)}
.meta{font-size:.78rem;color:var(--mut);margin-top:10px;line-height:1.7}.meta.warn{color:#d97706;font-weight:600}
/* choices */
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.opt{position:relative;display:flex;flex-direction:column;align-items:center;gap:9px;padding:16px 8px;border:1.5px solid var(--line);border-radius:16px;background:var(--bg);color:var(--ink);font:600 .8rem/1.5 Cairo;text-align:center;cursor:pointer;transition:transform .45s var(--sp),border-color .3s,background .3s,box-shadow .4s var(--e)}
.opt .ci{width:36px;height:36px;transition:transform .5s var(--sp)}
.opt:hover{transform:translateY(-4px);border-color:var(--c)}
.opt.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--sol));box-shadow:0 12px 26px color-mix(in srgb,var(--c) 28%,transparent);transform:translateY(-3px) scale(1.03)}
.opt.on .ci{transform:scale(1.2) rotate(-8deg)}
.opt:after{content:"✓";position:absolute;top:7px;inset-inline-end:7px;width:20px;height:20px;border-radius:50%;background:var(--c);color:#fff;font-size:12px;line-height:20px;transform:scale(0);transition:transform .45s var(--sp)}
.opt.on:after{transform:scale(1)}
.yrs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.yrs .opt{flex-direction:row;justify-content:center;padding:13px 6px}
.yrs b{font:700 1.5rem Amiri,serif;color:var(--c)}
.collapse{grid-column:1/-1;display:grid;grid-template-rows:0fr;margin-top:-14px;transition:grid-template-rows .5s var(--e),margin .5s var(--e)}
.collapse.open{grid-template-rows:1fr;margin-top:0}.collapse>div{overflow:hidden;padding:0 4px}.collapse.open>div{padding:4px}
/* buttons */
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:10px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#fff;border:0;border-radius:15px;height:52px;padding:0 22px;font:700 1rem Cairo,sans-serif;white-space:nowrap;text-decoration:none;cursor:pointer;transition:transform .4s var(--sp),box-shadow .4s var(--e)}
.btn:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(143,109,31,.4)}.btn:active{transform:scale(.97)}
.btn:before{content:"";position:absolute;top:0;bottom:0;width:60%;left:-80%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.4),transparent);transform:skewX(-20deg);transition:left .8s var(--e)}
.btn:hover:before{left:130%}
.btn .ci{width:26px;height:26px;padding:3px;background:#fff;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.btn.sec{background:transparent;color:var(--ink);border:1.5px solid var(--line)}.btn.sec:hover{box-shadow:none;border-color:var(--gold)}
.btn.sm{height:44px;padding:0 14px;font-size:.88rem;border-radius:12px}.btn.sm .ci{width:24px;height:24px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}.acts .btn{width:100%;padding:0 10px}.acts .span{grid-column:1/-1}
.btn.wa{background:linear-gradient(135deg,#25d366,#128c7e)}.btn.wa:hover{box-shadow:0 14px 30px rgba(18,140,126,.4)}
.btn.del:hover{border-color:var(--bad);color:var(--bad)}
.submit{grid-column:1/-1;width:100%;margin-top:12px}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.5);transform:scale(0);animation:rp .7s ease-out forwards;pointer-events:none}
@keyframes rp{to{transform:scale(4);opacity:0}}
.spin{width:20px;height:20px;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
.btn[disabled]{pointer-events:none;opacity:.9}
/* success */
.done{display:none;text-align:center;padding:30px 16px 24px;background:var(--sol);border:1px solid var(--line);border-radius:26px;box-shadow:0 24px 60px rgba(0,0,0,.1)}
.done.show{display:block;animation:up .8s var(--e) both}
.done svg{width:120px;height:120px}
.done circle{fill:none;stroke:var(--ok);stroke-width:4;stroke-dasharray:314;stroke-dashoffset:314;transform-origin:center;transform:rotate(-90deg);animation:dr .9s var(--e) .1s forwards}
.done path{fill:none;stroke:var(--ok);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:dr .5s var(--e) .8s forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.done b{display:block;font:700 1.8rem Amiri,serif;color:var(--ok);margin:10px 0 2px;animation:up .7s var(--e) 1s both}
.done p,.done .btn{animation:up .7s var(--e) 1.15s both}
#cf{position:fixed;inset:0;pointer-events:none;z-index:99}
footer{text-align:center;margin-top:26px;color:var(--mut);font-size:.8rem}
#adm{background:none;border:0;opacity:.2;cursor:pointer;padding:6px 8px;vertical-align:middle;transition:.3s}#adm:hover{opacity:1}#adm .ci{width:18px;height:18px}
/* admin */
#pin{position:fixed;inset:0;background:rgba(10,12,16,.55);backdrop-filter:blur(8px);z-index:60;display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .4s}
#pin.show{opacity:1;pointer-events:auto}
#pin .card{width:min(340px,90%);text-align:center;background:var(--sol);border:1px solid var(--line);border-radius:26px;padding:26px 22px;transform:scale(.8) translateY(30px);transition:transform .55s var(--sp)}#pin.show .card{transform:none}
#pin .big{width:60px;height:60px;padding:13px;border-radius:19px;background:rgba(245,158,11,.14);margin:0 auto 8px}
#pinem,#pinpw{width:100%;height:50px;padding:0 13px;text-align:center;border:1.5px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px;outline:none}#pinem:focus,#pinpw:focus{border-color:var(--gold)}
#e_pw{color:var(--bad);font-size:.8rem;min-height:1.2em;margin-top:6px}
#lb,#tm{position:fixed;inset:0;z-index:70;background:rgba(8,10,14,.75);backdrop-filter:blur(10px);display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .35s}#lb.show,#tm.show{opacity:1;pointer-events:auto}
.lbc{width:min(520px,94%);background:var(--sol);border:1px solid var(--line);border-radius:26px;padding:16px;text-align:center;transform:scale(.7);transition:transform .55s var(--sp)}#lb.show .lbc,#tm.show .lbc{transform:none}
#lbi{width:100%;max-height:60vh;object-fit:contain;border-radius:18px;display:block;margin-bottom:12px;background:var(--bg)}
.lbn{font:700 1.3rem Amiri,serif}.lbm{font-size:.78rem;color:var(--mut);margin:2px 0 14px}
#dash{position:fixed;inset:0;background:var(--bg);z-index:50;overflow:auto;transform:translateY(100%);visibility:hidden;transition:transform .6s var(--e),visibility 0s .6s}
#dash.show{transform:none;visibility:visible;transition:transform .6s var(--e)}
.dwrap{display:grid;grid-template-columns:270px 1fr;min-height:100%}
aside{background:#14181f;color:#f1e6cc;padding:22px 16px}
aside .hero{width:150px;margin-bottom:24px;animation:none}
.fold{display:flex;align-items:center;gap:10px;width:100%;text-align:right;background:transparent;border:1px solid rgba(241,230,204,.15);color:inherit;border-radius:13px;padding:10px 12px;margin-bottom:8px;font:600 .85rem Cairo,sans-serif;cursor:pointer;transition:.35s var(--e)}
.fold .ci{width:32px;height:32px;padding:4px;border-radius:10px;background:#f1e6cc}
.fold:hover{transform:translateX(-5px);border-color:var(--gold)}.fold.on{background:var(--gold);color:#14181f;border-color:var(--gold)}
.fold span:nth-child(2){flex:1}.fold .n{background:rgba(0,0,0,.25);border-radius:20px;padding:1px 9px;font-size:.8rem}
main{padding:22px}.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:16px}
.top .acts{min-width:min(100%,310px)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--sol);border:1px solid var(--line);border-radius:16px;padding:14px;font-size:.85rem;animation:up .6s var(--e) both;animation-delay:calc(var(--i)*60ms)}
.stat b{font:700 2rem Amiri,serif;color:var(--gold2);display:block}
.sbox{position:relative}.sbox .ci{position:absolute;top:50%;inset-inline-start:14px;transform:translateY(-50%);width:22px;height:22px}
.sbox input{width:100%;height:50px;padding:0 46px;border:1.5px solid var(--line);border-radius:14px;background:var(--sol);color:var(--ink);font:inherit;font-size:16px;outline:none}.sbox input:focus{border-color:var(--gold)}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.tab{border:1px solid var(--line);background:var(--sol);color:var(--ink);border-radius:20px;padding:7px 15px;cursor:pointer;font:600 .85rem Cairo,sans-serif;transition:.35s var(--sp)}
.tab:hover{transform:translateY(-2px)}.tab.on{background:var(--gold);color:#fff;border-color:var(--gold)}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.p{background:var(--sol);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:7px;font-size:.85rem;transition:transform .4s var(--sp),box-shadow .4s}
.p:hover{transform:translateY(-5px);box-shadow:0 16px 34px rgba(0,0,0,.14)}
.p .ph{position:relative;width:92px;height:92px;border-radius:50%;background:var(--bg) center/cover;border:2px solid var(--gold);margin:0 auto 4px;padding:0;cursor:zoom-in;display:grid;place-items:center;transition:transform .45s var(--sp)}.p .ph:hover{transform:scale(1.08)}
.p .ph .ci{opacity:0;width:32px;height:32px;padding:5px;border-radius:50%;background:#fff;transition:.3s}.p .ph:hover .ci{opacity:1}
.p h3{margin:0 0 4px;text-align:center;font-size:1rem}
.p div.r{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px dashed var(--line);padding-top:7px}
.r span:first-child{display:inline-flex;align-items:center;gap:6px;color:var(--mut)}.r .ci{width:18px;height:18px}.r>span:last-child{text-align:end;overflow-wrap:anywhere}
.wl{display:inline-flex;align-items:center;gap:6px;color:#128c7e;font-weight:700;text-decoration:none}.wl .ci{width:18px;height:18px}
@media(prefers-color-scheme:dark){.wl{color:#25d366}}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:50px 0}.empty .ci{width:56px;height:56px;margin:0 auto 8px}
.btn.sr{transition:opacity .7s var(--e),transform .5s var(--sp),filter .7s var(--e),box-shadow .4s var(--e)}
.p.sr{transition:opacity .7s var(--e),transform .6s var(--e),filter .7s var(--e),box-shadow .4s}
@keyframes nod{30%{transform:translateY(3px)}60%{transform:translateY(-3px)}}
@keyframes wig{0%,100%{transform:rotate(0)}15%,45%{transform:rotate(-18deg)}30%,60%{transform:rotate(18deg)}}
@keyframes flipy{50%{transform:rotateY(180deg)}}
@keyframes pop2{40%{transform:scale(1.28) rotate(-8deg)}}
@keyframes toss{40%{transform:translateY(-7px) rotate(-14deg)}70%{transform:translateY(0) rotate(5deg)}}
@keyframes shut{40%{transform:scale(.78)}70%{transform:scale(1.15)}}
@keyframes bob{50%{transform:translateY(-5px)}}
#w_photo:focus-within .bd .ci{animation:shut .6s var(--e)}
#w_name:focus-within .bd .ci,#w_other:focus-within .bd .ci{animation:nod .6s var(--e)}
#w_code:focus-within .bd .ci{animation:flipy .7s var(--e)}
#w_phone:focus-within .bd .ci{animation:wig .7s ease-in-out}
#w_email:focus-within .bd .ci{animation:pop2 .6s var(--e)}
#w_college:focus-within .bd .ci{animation:bob .6s var(--e)}
#w_year:focus-within .bd .ci{animation:toss .7s var(--e)}
/* ticket printer */
.lk .sec{margin:38px 0 16px}
.rp{display:flex;flex-direction:column;align-items:center;max-width:410px;margin:0 auto}
.mach{position:relative;isolation:isolate;width:100%;overflow:hidden;border-radius:24px;border:1px solid #0b0d12;background:linear-gradient(160deg,rgba(255,255,255,.09),transparent 45%),#2c313b;padding:12px 12px 32px;box-shadow:0 20px 36px -20px rgba(0,0,0,.55),0 6px 14px -8px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.14),inset 0 -1px 0 rgba(0,0,0,.55)}
.mach .slot{position:absolute;z-index:40;inset-inline:24px;bottom:12px;height:8px;border-radius:4px;background:#06080b;border:1px solid #000;box-shadow:inset 0 2px 3px #000}
.mh{position:relative;z-index:10;display:flex;align-items:flex-start;justify-content:space-between;height:46px}
.ml{height:34px;width:auto}
.leds{display:flex;gap:7px;padding-top:8px}
.led{width:10px;height:10px;border-radius:50%;background:#3a404c;box-shadow:inset 0 1px 2px #000;transition:.3s}
.rp[data-st=nf] .l1{background:#ef4444;box-shadow:0 0 10px #ef4444}
.rp[data-st=proc] .l2,.rp[data-st=print] .l2{background:#fbbf24;box-shadow:0 0 10px #fbbf24;animation:blink 1s infinite}
.rp[data-st=done] .l3{background:#22c55e;box-shadow:0 0 10px #22c55e}
@keyframes blink{50%{opacity:.35}}
.scr{position:relative;z-index:10;isolation:isolate;overflow:hidden;border-radius:12px;border:1px solid #000;background:#0e1116;color:#f1e6cc;padding:16px;box-shadow:inset 0 0 24px 4px rgba(0,0,0,.5)}
.sl{display:block;font:600 .78rem Cairo;color:#a79e88;margin-bottom:8px}
.lrow{display:grid;grid-template-columns:1fr auto;gap:8px}
.lrow input{width:100%;height:44px;min-width:0;border-radius:12px;border:1.5px solid #3a4150;background:#171b22;color:#f1e6cc;font:700 1rem ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;text-align:center;text-transform:uppercase;outline:none;transition:border-color .3s}
.lrow input:focus{border-color:#d3ab4b}.lrow input::placeholder{color:#6b7280;letter-spacing:.06em}
.stt{display:flex;align-items:center;gap:10px;margin-top:14px;min-height:22px}
.sti{width:20px;height:20px;display:grid;place-items:center;flex:none}
.sti>*{animation:pop3 .25s var(--e)}
.sti .dot{width:8px;height:8px;border-radius:50%;background:#6b7280}
.sti .ic{width:20px;height:20px;stroke-width:2.6}.ok2{color:#4ade80}.nf2{color:#f87171}
.spin.g{width:18px;height:18px;border-width:3px;border-color:rgba(211,171,75,.3);border-top-color:#e6c26d}
@keyframes pop3{from{opacity:0;transform:scale(.8)}}
.stx{display:grid;flex:1;min-width:0}
.stx>div{grid-area:1/1;font:600 .82rem Cairo;color:#a79e88;animation:stIn .2s var(--e)}
.stx>.o{animation:stOut .2s var(--e) forwards}
.rp[data-st=done] .stx>div{color:#4ade80}.rp[data-st=nf] .stx>div{color:#f87171}
@keyframes stIn{from{opacity:0;transform:translateY(4px)}}@keyframes stOut{to{opacity:0;transform:translateY(-4px)}}
.out{position:relative;z-index:50;margin-top:-16px;width:calc(80% + 48px);max-width:100%;height:0;overflow:hidden;padding:0 24px;transition:height .35s var(--e)}
.slotsh{position:absolute;z-index:20;inset-inline:24px;top:-4px;height:8px;background:rgba(0,0,0,.75);filter:blur(6px);pointer-events:none;opacity:0;transition:opacity .2s}
.out.on .slotsh{opacity:1}
.pw{position:relative;transform:translateY(calc(-100% + 2px));filter:drop-shadow(0 8px 14px rgba(0,0,0,.28))}
.paper{position:relative;min-height:200px;padding:24px 20px 34px;color:#14181f;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(0,0,0,.018) 3px 4px),#fbf6e9;text-align:center}
.rl{display:block;width:96px;margin:0 auto 4px}
.paper h2{font:700 1.3rem Amiri,serif;margin:4px 0 2px}
.rs{font-size:.74rem;color:#6b6250;letter-spacing:.04em}
.dsh{border:0;border-top:2px dashed #cdbf98;margin:14px 0}
.rph{width:88px;height:88px;border-radius:50%;margin:10px auto 8px;background:#eee center/cover;border:3px solid #fff;box-shadow:0 0 0 2px #b8923a}
.rn{font:700 1.1rem Cairo;line-height:1.5}
.tn{font:800 1.3rem ui-monospace,Menlo,Consolas,monospace;letter-spacing:.1em;direction:ltr;margin-top:4px;color:#8f6d1f}
.rr{display:flex;justify-content:space-between;gap:12px;font-size:.82rem;padding:4px 0;text-align:start}
.rr span{color:#6b6250}.rr b{text-align:end}
.stamp{display:inline-block;margin:12px 0 0;transform:rotate(-6deg);border:3px solid #2f7d4f;color:#2f7d4f;font:800 .9rem Cairo;padding:3px 14px;border-radius:9px}
.bars{display:block;width:100%;max-width:230px;height:46px;margin:0 auto 6px}
.rf{font-size:.76rem;color:#6b6250;line-height:1.8;margin:10px 0 0}
.lacts{display:none;width:100%;margin-top:16px}.lacts.on{display:grid;animation:up .6s var(--e) both}
.tk{display:inline-flex;flex-direction:column;gap:2px;margin:12px auto 4px;padding:10px 22px;border-radius:16px;background:rgba(168,85,247,.1);border:1.5px dashed #a855f7;animation:up .7s var(--e) 1.1s both}
.tk span{font-size:.75rem;color:var(--mut)}.tk b{font:800 1.4rem ui-monospace,Menlo,Consolas,monospace;letter-spacing:.12em;direction:ltr;color:var(--ink);margin:0;animation:none}
.done .acts{animation:up .7s var(--e) 1.25s both}
.bdg{display:inline-block;padding:2px 12px;border-radius:20px;font-weight:700;font-size:.8rem;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border:1px solid color-mix(in srgb,var(--c) 40%,transparent)}
.btn.ok{background:linear-gradient(135deg,#2f7d4f,#1f5a37)}
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-bottom:16px}
.cb{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--sol);border:1px solid var(--line);border-radius:16px;padding:14px}
.cb b{display:block;font-size:.92rem}.cb>div>span{font-size:.76rem;color:var(--mut)}
.sw{position:relative;flex:none;width:58px;height:32px;border-radius:32px;border:0;background:var(--line);cursor:pointer;transition:background .3s}
.sw i{position:absolute;top:4px;inset-inline-start:4px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .4s var(--sp)}
.sw.on{background:var(--ok)}.sw.on i{transform:translateX(-26px)}
.cap{display:flex;align-items:center;gap:6px;font-weight:700}.cap .over{color:var(--bad)}
.cap input,.ti{border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px;outline:none}
.cap input{width:70px;height:40px;text-align:center}
.ti{width:100%;height:46px;padding:0 12px;margin:6px 0 12px}
#tm label{font-weight:700;font-size:.85rem}#tm input[type=file]{display:block;margin:6px 0 10px;font-size:.8rem;max-width:100%}
#tmp{width:100%;max-height:200px;object-fit:contain;border-radius:12px;margin-bottom:10px}
.tkl{margin-top:8px;height:40px}.tki{width:100%;max-height:260px;object-fit:contain;margin-top:10px;border-radius:8px}
.acts .btn.sec{grid-column:auto;margin:0}.acts .btn.sec.span{grid-column:1/-1}

.paper.card{background:none;padding:0;min-height:0}
.cardimg{display:block;width:100%;border-radius:14px;box-shadow:0 6px 16px rgba(0,0,0,.25);cursor:zoom-in}
.bulk{background:var(--sol);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:16px}.bulk summary{cursor:pointer;font-weight:700}
.bulk textarea{width:100%;min-height:130px;margin:10px 0;padding:10px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:600 16px ui-monospace,Menlo,monospace;direction:ltr;resize:vertical;outline:none}
.bulk label{display:flex;gap:8px;align-items:center;font-size:.85rem;margin-bottom:10px}.bulk .hint{margin:0}#bres{font-size:.82rem;margin-top:10px;line-height:1.8}
@media(max-width:720px){.grid{grid-template-columns:1fr}.dwrap{grid-template-columns:1fr}aside{padding:14px}.opts{grid-template-columns:1fr 1fr}.yrs{grid-template-columns:1fr 1fr}.pb{flex-direction:column;text-align:center}h1{font-size:1.9rem}.hero{width:min(200px,58%)}}
@media(prefers-reduced-motion:reduce){*,:before,:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
#pinem{margin-bottom:10px}#pinem,#pinpw{direction:ltr}#e_pw{color:var(--bad);font-size:.82rem;font-weight:600;min-height:1.3em;margin-top:8px}
#secP{-webkit-user-select:none;user-select:none;touch-action:manipulation}
.lgn{display:inline-block;min-width:24px;padding:0 8px;margin-inline-start:6px;border-radius:99px;background:rgba(184,146,58,.16);color:var(--gold2);font-size:.78rem;text-align:center}
.lg{max-height:340px;overflow:auto;margin:10px 0;display:grid;gap:6px}
.lr{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:8px 12px;border-radius:10px;background:var(--bg);border-inline-start:3px solid var(--c);font-size:.8rem;line-height:1.7}
.lr .lt{color:var(--mut);white-space:nowrap}.lr em{display:block;font-style:normal;color:var(--mut);font-size:.74rem;direction:ltr;text-align:start}
</style>
