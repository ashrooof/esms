<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ESMS | رفع تذكرة السفر</title>
<meta name="theme-color" content="#f1e6cc" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#10131a" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A6%85%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1e6cc;--card:rgba(251,246,233,.82);--sol:#fbf6e9;--ink:#14181f;--mut:#6b6250;--gold:#b8923a;--gold2:#8f6d1f;--line:#dccfa9;--ok:#2f7d4f;--bad:#b3392e;--e:cubic-bezier(.22,1,.36,1);--sp:cubic-bezier(.34,1.56,.64,1);--bb:#14181f;--bf:#e6c26d;--bs:0 10px 24px -10px rgba(20,24,31,.55)}
@media(prefers-color-scheme:dark){:root{--bg:#10131a;--card:rgba(26,31,39,.82);--sol:#1a1f27;--ink:#f1e6cc;--mut:#a79e88;--gold:#d3ab4b;--gold2:#e6c26d;--line:#2d3440;--bb:linear-gradient(135deg,#dcb556,#b8923a);--bf:#14181f;--bs:0 10px 24px -10px rgba(211,171,75,.5)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,sans-serif;min-height:100vh;overflow-x:hidden;line-height:1.6;padding-top:env(safe-area-inset-top,0)}
.ci{width:24px;height:24px;flex:none;display:block;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.bg{position:fixed;inset:-80px 0;z-index:0;pointer-events:none;overflow:hidden;transform:translateY(calc(var(--p,0)*-.1px))}
.bg i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.36;background:var(--gold);animation:drift 18s ease-in-out infinite alternate}
.bg i:nth-child(1){width:340px;height:340px;top:-90px;right:-60px}
.bg i:nth-child(2){width:300px;height:300px;bottom:-80px;left:-70px;background:var(--gold2);animation-delay:-6s}
.bg i:nth-child(3){width:200px;height:200px;top:45%;left:55%;opacity:.2;animation-delay:-11s}
@keyframes drift{to{transform:translate(-50px,60px) scale(1.25)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes up{from{opacity:0;transform:translateY(22px)}}
.wrap{position:relative;z-index:1;max-width:780px;margin:0 auto;padding:30px 16px 60px}
header{text-align:center;margin-bottom:22px;transform:translateY(calc(var(--p,0)*.22px));opacity:calc(1 - var(--p,0)/650)}
.hero{display:block;position:relative;width:min(230px,62%);margin:0 auto;animation:pop 1s var(--sp) both}
.hero:before{content:"";position:absolute;inset:-18% -28%;background:radial-gradient(closest-side,rgba(184,146,58,.34),transparent 72%);z-index:-1;animation:breathe 5s ease-in-out infinite}
.hero img{display:block;width:100%;height:auto;filter:drop-shadow(0 10px 18px rgba(143,109,31,.25))}
@keyframes breathe{50%{transform:scale(1.12);opacity:.7}}@keyframes pop{from{opacity:0;transform:scale(.5) rotate(-8deg)}}
h1{font:700 2.3rem Amiri,serif;margin:18px 0 4px;background:linear-gradient(100deg,var(--ink) 30%,var(--gold) 50%,var(--ink) 70%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s ease-in-out infinite}
@keyframes shine{0%,100%{background-position:100% 0}50%{background-position:0 0}}
.sub{color:var(--mut);margin:0}
.rule{width:100px;height:3px;margin:14px auto 0;border-radius:3px;background:linear-gradient(90deg,transparent,var(--gold),transparent);animation:grow 1.2s var(--e) .4s both}
@keyframes grow{from{transform:scaleX(0)}}
.pbar{position:sticky;top:calc(10px + env(safe-area-inset-top,0px));z-index:8;display:flex;align-items:center;gap:12px;padding:11px 18px;margin-bottom:20px;border-radius:999px;background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.08)}
.trk{flex:1;height:8px;border-radius:8px;background:var(--line);overflow:hidden}
.trk i{display:block;height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,var(--gold2),var(--gold),#f0d58a);transition:width .7s var(--e);box-shadow:0 0 12px var(--gold)}
#pt{font:800 .85rem Cairo;min-width:42px;text-align:center;color:var(--gold2)}
.sr{opacity:0;transform:translateY(40px) scale(.97);filter:blur(3px);transition:opacity .7s var(--e),transform .85s var(--e),filter .7s var(--e)}
.sr.in{opacity:1;transform:none;filter:none;transition-delay:var(--d,0ms)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}
.sec{grid-column:1/-1;display:flex;align-items:center;gap:10px;margin:14px 0 0;font:700 1.1rem Amiri,serif;color:var(--gold2)}
.sec .n{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--gold);color:var(--gold2);font:700 1.05rem Amiri,serif;flex:none}
.sec:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.fc{--c:#b8923a;position:relative;overflow:hidden;background:var(--sol);border:1px solid var(--line);border-radius:22px;padding:16px 16px 14px;box-shadow:0 6px 18px rgba(0,0,0,.05);transition:opacity .7s var(--e),transform .7s var(--e),filter .7s var(--e),box-shadow .5s var(--e),border-color .3s}
.fc:before{content:"";position:absolute;z-index:2;inset-block:16px;inset-inline-start:6px;width:4px;border-radius:4px;background:var(--c);transform:scaleY(0);transition:transform .55s var(--e),background .3s}
.fc:hover{box-shadow:0 12px 28px rgba(0,0,0,.09)}
.fc:focus-within{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 22%,transparent),0 16px 34px color-mix(in srgb,var(--c) 18%,transparent)}
.fc:focus-within:before{transform:scaleY(1)}
.fc.ok{border-color:color-mix(in srgb,var(--ok) 55%,var(--line))}.fc.ok:before{transform:scaleY(1);background:var(--ok)}
.fc.bad{border-color:var(--bad)}.fc.bad:before{transform:scaleY(1);background:var(--bad)}
.fh{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.bd{width:44px;height:44px;flex:none;border-radius:14px;display:grid;place-items:center;color:var(--gold2);background:color-mix(in srgb,var(--gold) 12%,var(--sol));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--gold) 28%,transparent)}
.fh label{flex:1;margin:0;font-weight:700;font-size:.92rem;line-height:1.45}
.st{width:26px;height:26px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;transform:scale(0) rotate(-90deg);transition:transform .55s var(--sp)}
.st .ci{width:15px;height:15px;stroke-width:3}.ok .st{transform:none}
.fc input[type=text],.fc input:not([type]){width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:13px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px;outline:none;transition:border-color .3s}
.fc input:focus{border-color:var(--c)}.fc input::placeholder{color:var(--mut);opacity:.55}
.hint{font-size:.76rem;color:var(--mut);margin-top:10px;overflow-wrap:anywhere}
.err{display:grid;grid-template-rows:0fr;color:var(--bad);font-size:.8rem;font-weight:600;transition:grid-template-rows .35s var(--e)}
.err span{overflow:hidden}.bad .err{grid-template-rows:1fr}.bad .err span{padding-top:8px}
.fc.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(7px)}40%{transform:translateX(-6px)}60%{transform:translateX(4px)}80%{transform:translateX(-2px)}}
.pb{display:flex;align-items:center;gap:22px}
.avatar{position:relative;width:116px;height:116px;border-radius:50%;flex:none;border:0;cursor:pointer;background:var(--bg) center/cover;display:grid;place-items:center;color:inherit;transition:transform .5s var(--sp)}
.avatar .ci{width:38px;height:38px;color:var(--gold2)}
.avatar:before{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px dashed var(--c);animation:spin 14s linear infinite}
.avatar:after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--c);opacity:0;animation:ring 2.4s ease-out infinite}
.avatar.has:before{border-style:solid;animation:none}.avatar.has:after{animation:none}.avatar.has .ci{display:none}
.avatar:hover{transform:scale(1.07) rotate(-3deg)}
@keyframes ring{from{opacity:.7;transform:scale(1)}to{opacity:0;transform:scale(1.35)}}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{position:relative;display:flex;flex-direction:column;align-items:center;gap:9px;padding:16px 8px;border:1.5px solid var(--line);border-radius:16px;background:var(--bg);color:var(--ink);font:700 .88rem Cairo;cursor:pointer;transition:transform .45s var(--sp),border-color .3s,background .3s,box-shadow .4s var(--e)}
.opt .ci{width:26px;height:26px;color:var(--gold2)}.opt:hover{transform:translateY(-4px);border-color:var(--c)}
.opt.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--sol));box-shadow:0 12px 26px color-mix(in srgb,var(--c) 28%,transparent);transform:translateY(-3px) scale(1.03)}
.opt:after{content:"✓";position:absolute;top:7px;inset-inline-end:7px;width:20px;height:20px;border-radius:50%;background:var(--c);color:#fff;font-size:12px;line-height:20px;transform:scale(0);transition:transform .45s var(--sp)}
.opt.on:after{transform:scale(1)}
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:10px;background:var(--bb);color:var(--bf);border:1px solid color-mix(in srgb,var(--gold) 60%,transparent);border-radius:14px;height:54px;padding:0 26px;font:700 1rem Cairo,sans-serif;letter-spacing:.01em;white-space:nowrap;cursor:pointer;box-shadow:var(--bs);transition:transform .35s var(--e),box-shadow .35s var(--e),filter .3s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.08)}.btn:active{transform:scale(.98)}
.btn:before{content:"";position:absolute;top:0;bottom:0;width:50%;left:-70%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.22),transparent);transform:skewX(-20deg);transition:left .8s var(--e)}
.btn:hover:before{left:130%}
.btn .ci{width:20px;height:20px}
.btn.sec{background:transparent;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}.btn.sec:hover{border-color:var(--gold);color:var(--gold2);filter:none}
.btn.sm{height:44px;padding:0 18px;font-size:.9rem;border-radius:12px}
.btn[disabled]{pointer-events:none;opacity:.85}
.scr .btn{--bb:linear-gradient(135deg,#dcb556,#b8923a);--bf:#14181f;box-shadow:none}
.submit{grid-column:1/-1;width:100%;margin-top:12px}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.3);transform:scale(0);animation:rp .7s ease-out forwards;pointer-events:none}
@keyframes rp{to{transform:scale(4);opacity:0}}
.spin{width:20px;height:20px;border:3px solid color-mix(in srgb,var(--bf) 25%,transparent);border-top-color:var(--bf);border-radius:50%;animation:spin .7s linear infinite}
.spin.g{width:18px;height:18px;border-color:rgba(211,171,75,.3);border-top-color:#e6c26d}
.done{display:none;text-align:center;padding:30px 16px 26px;background:var(--sol);border:1px solid var(--line);border-radius:26px;box-shadow:0 24px 60px rgba(0,0,0,.1)}
.done.show{display:block;animation:up .8s var(--e) both}
.done svg{width:120px;height:120px}
.done circle{fill:none;stroke:var(--ok);stroke-width:4;stroke-dasharray:314;stroke-dashoffset:314;transform-origin:center;transform:rotate(-90deg);animation:dr .9s var(--e) .1s forwards}
.done path{fill:none;stroke:var(--ok);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:dr .5s var(--e) .8s forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.done b{display:block;font:700 1.8rem Amiri,serif;color:var(--ok);margin:10px 0 2px;animation:up .7s var(--e) 1s both}
.done p,.done .btn,.tk{animation:up .7s var(--e) 1.15s both}
.tk{display:inline-block;margin:14px 0 18px;padding:10px 26px;border:2px dashed var(--gold);border-radius:14px;font:800 1.3rem Cairo;color:var(--gold2);letter-spacing:.06em}
#cf{position:fixed;inset:0;pointer-events:none;z-index:99}
/* printer */
.lk .sec{margin:42px 0 16px}
.rp{display:flex;flex-direction:column;align-items:center;max-width:410px;margin:0 auto}
.mach{position:relative;isolation:isolate;width:100%;overflow:hidden;border-radius:24px;border:1px solid #0b0d12;background:linear-gradient(160deg,rgba(255,255,255,.09),transparent 45%),#2c313b;padding:14px 14px 34px;box-shadow:0 20px 36px -20px rgba(0,0,0,.55),0 6px 14px -8px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.14),inset 0 -1px 0 rgba(0,0,0,.55)}
.mach .slot{position:absolute;z-index:40;inset-inline:24px;bottom:12px;height:8px;border-radius:4px;background:#06080b;border:1px solid #000;box-shadow:inset 0 2px 3px #000}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;color:#e6c26d;font:700 .95rem Cairo;letter-spacing:.04em}
.leds{display:flex;gap:7px}.led{width:10px;height:10px;border-radius:50%;background:#3a404c;box-shadow:inset 0 1px 2px #000;transition:.3s}
.rp[data-st=nf] .l1{background:#ef4444;box-shadow:0 0 10px #ef4444}
.rp[data-st=proc] .l2{background:#fbbf24;box-shadow:0 0 10px #fbbf24;animation:blink 1s infinite}
.rp[data-st=done] .l3{background:#22c55e;box-shadow:0 0 10px #22c55e}
@keyframes blink{50%{opacity:.35}}
.scr{border-radius:12px;border:1px solid #000;background:#0e1116;color:#f1e6cc;padding:16px;box-shadow:inset 0 0 24px 4px rgba(0,0,0,.5)}
.sl{display:block;font:600 .78rem Cairo;color:#a79e88;margin-bottom:8px}
.lrow{display:grid;grid-template-columns:1fr auto;gap:8px}
.lrow input{width:100%;height:44px;min-width:0;border-radius:12px;border:1.5px solid #3a4150;background:#171b22;color:#f1e6cc;font:700 1rem ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;text-align:center;outline:none;transition:border-color .3s}
.lrow input:focus{border-color:#d3ab4b}.lrow input::placeholder{color:#6b7280}
.stt{display:flex;align-items:center;gap:10px;margin-top:14px;min-height:22px;font:600 .84rem Cairo;color:#a79e88}
.rp[data-st=done] .stt{color:#4ade80}.rp[data-st=nf] .stt{color:#f87171}
.out{position:relative;z-index:1;margin-top:-16px;width:calc(80% + 48px);max-width:100%;height:0;overflow:hidden;padding:0 24px;transition:height .7s var(--e)}
.paper{background:var(--sol);color:var(--ink);padding:34px 18px 22px;text-align:center;border-radius:0 0 14px 14px;border:1px solid var(--line);border-top:0;box-shadow:0 14px 30px rgba(0,0,0,.14);-webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/14px 100%;mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/14px 100%;padding-bottom:30px}
.paper h3{font:700 1.4rem Amiri,serif;margin:0 0 4px}.paper .cd{color:var(--mut);font-size:.85rem}
.badge .ci{width:18px;height:18px}.badge{display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:8px 20px;border-radius:999px;font-weight:700;font-size:.95rem}
.b-accepted{background:rgba(47,125,79,.15);color:var(--ok)}.b-rejected{background:rgba(179,57,46,.15);color:var(--bad)}.b-review{background:rgba(184,146,58,.18);color:var(--gold2)}
footer{text-align:center;margin-top:34px;color:var(--mut);font-size:.8rem}footer p{margin:4px 0 0;opacity:.8}
#adminBtn{background:none;border:0;opacity:.25;cursor:pointer;padding:6px 8px;color:var(--mut);transition:.3s}#adminBtn:hover{opacity:1}
.modal{position:fixed;inset:0;background:rgba(10,12,16,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:60;display:grid;place-items:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .4s}
.modal.show{opacity:1;pointer-events:auto}
.modal .card{width:min(380px,100%);text-align:center;background:var(--sol);border:1px solid var(--line);border-radius:26px;padding:26px 22px;transform:scale(.85) translateY(30px);transition:transform .55s var(--sp)}.modal.show .card{transform:none}
.modal .big{width:60px;height:60px;padding:16px;border-radius:19px;color:var(--gold2);background:color-mix(in srgb,var(--gold) 14%,var(--sol));margin:0 auto 8px}
.modal h3{font:700 1.4rem Amiri,serif;margin:6px 0}.modal p{font-size:.88rem;color:var(--mut);margin:0 0 14px}
.modal .btn{width:100%}.modal .btn+.btn,.modal input+.btn{margin-top:12px}
#otpInput{width:100%;height:50px;margin-top:14px;text-align:center;font:700 1.3rem Cairo;letter-spacing:6px;border:1.5px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);outline:none}#otpInput:focus{border-color:var(--gold)}
#loginMsg{color:var(--bad);font-size:.82rem;min-height:1.3em;margin-top:10px}
#dash{position:fixed;inset:0;background:var(--bg);z-index:50;overflow:auto;transform:translateY(100%);visibility:hidden;transition:transform .6s var(--e),visibility 0s .6s;padding:calc(22px + env(safe-area-inset-top,0px)) 16px 40px}
#dash.show{transform:none;visibility:visible;transition:transform .6s var(--e)}
.dw{max-width:1100px;margin:0 auto}
.dt{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.dt h2{font:700 1.7rem Amiri,serif;margin:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--sol);border:1px solid var(--line);border-radius:18px;padding:14px;font-size:.85rem;color:var(--mut);animation:up .6s var(--e) both;animation-delay:calc(var(--i)*70ms)}
.stat b{font:700 2.1rem Amiri,serif;display:block;line-height:1.2}
#search{width:100%;height:50px;padding:0 16px;border:1.5px solid var(--line);border-radius:14px;background:var(--sol);color:var(--ink);font:inherit;font-size:16px;outline:none;margin-bottom:18px}#search:focus{border-color:var(--gold)}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.p{background:var(--sol);border:1px solid var(--line);border-radius:20px;padding:16px;font-size:.88rem;animation:up .5s var(--e) both;transition:transform .4s var(--sp),box-shadow .4s}
.p:hover{transform:translateY(-5px);box-shadow:0 16px 34px rgba(0,0,0,.14)}
.p h3{margin:0 0 8px;text-align:center;font-size:1rem}
.r{display:flex;justify-content:space-between;gap:8px;border-top:1px dashed var(--line);padding:7px 0 0;margin-top:7px}.r span:first-child{color:var(--mut)}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:50px 0}
@media(max-width:560px){.grid{grid-template-columns:1fr}h1{font-size:2rem}.pb{gap:18px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}.sr{opacity:1;transform:none;filter:none}}
</style>
</head>
